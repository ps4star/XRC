# xrc.cfg for FINAL FANTASY XIII (the Steam release's ffxiiiimg.exe, unpacked): what xrc cannot work out from the code.
# Format: see README.md ("The game folder: xrc.cfg"). Addresses in hex.

# The CRT's frame helpers (VC9): a prolog saves ebx esi edi and the caller's ebp for its caller, an epilog restores them
frame_prolog 0101a27c   # __SEH_prolog4
frame_prolog 01017a4b   # __EH_prolog3
frame_prolog 01017a7e   # __EH_prolog3_catch
frame_epilog 0101a2c1   # __SEH_epilog4
frame_epilog 01017ab4   # __EH_epilog3

# The CRT's math entry points (replaced by ovr_crt_math.c): x87 values taken, x87 values left
x87_helper 0100f75a 2 1   # __CIatan2
x87_helper 0100f7b0 1 1
x87_helper 0100f8e0 1 1
x87_helper 0100fd40 1 0
x87_helper 0100fd76 1 0
x87_helper 010108a0 1 1
x87_helper 01012f2a 2 1
x87_helper 01013b90 1 1
x87_helper 01013df0 2 1
x87_helper 010153b0 1 1
x87_helper 010154fc 1 1
x87_helper 01015590 1 1
x87_helper 0101f150 1 1   # __CItan
x87_helper 0101f110 0 1   # tan (double on the stack)
x87_helper 0100f770 0 1   # cos (double on the stack)
x87_helper 0100f8a0 0 1   # sin (double on the stack)
x87_helper 0100f7ff 0 1
x87_helper 0100f92f 0 1
x87_helper 0100eed4 0 0   # __libm_sse2_sin (xmm0)
x87_helper 0100f5a2 0 0   # __libm_sse2_cos (xmm0)

