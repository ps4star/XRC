# xrc.cfg for FINAL FANTASY XIII-2 (the Steam release's ffxiii2img.exe: no SteamStub, not packed): what xrc cannot work
# out from the code. Format: see README.md ("The game folder: xrc.cfg"). Addresses in hex.

# The CRT's frame helpers (VC9, found by Ghidra's library signatures; the same bytes as FF13's): a prolog saves ebx esi
# edi and the caller's ebp for its caller, an epilog restores them
frame_prolog 00cf94d0   # __SEH_prolog4
frame_prolog 00cf563d   # __EH_prolog3
frame_prolog 00cf5670   # __EH_prolog3_catch
frame_epilog 00cf9515   # __SEH_epilog4
frame_epilog 00cf56a6   # __EH_epilog3

# the C runtime's x87 math entry points (ovr_alba.c): values taken from / left on the x87 stack
x87_helper 00ceb6b0 0 1   # acos
x87_helper 00ceb6f0 1 1   # __CIacos
x87_helper 00ceb73f 0 1   # acos (x87 entry)
x87_helper 00ceca30 0 1   # fmod
x87_helper 00ceca3a 2 1   # __CIfmod
x87_helper 00cea080 1 0   # _ftol2_sse
x87_helper 00cea0b6 1 0   # _ftol2
x87_helper 00cee420 0 1   # asin
x87_helper 00cee460 1 1   # __CIasin
x87_helper 00cee4af 0 1   # asin (x87 entry)
x87_helper 00cef8c0 0 1   # pow
x87_helper 00cef900 2 1   # __CIpow
x87_helper 00cef954 0 1   # pow (x87 entry)
x87_helper 00cf29d0 0 1   # exp
x87_helper 00cf2a0c 1 1   # __CIexp
x87_helper 00cf2a47 0 1   # exp (x87 entry)
x87_helper 00cf2a60 0 1   # log
x87_helper 00cf2aa0 1 1   # __CIlog
x87_helper 00cf2aef 0 1   # log (x87 entry)
x87_helper 00cf2bb0 0 1   # cos
x87_helper 00cf2bf0 1 1   # __CIcos
x87_helper 00cf2c3f 0 1   # cos (x87 entry)
x87_helper 00cf2ce0 0 1   # sin
x87_helper 00cf2d20 1 1   # __CIsin
x87_helper 00cf2d6f 0 1   # sin (x87 entry)
x87_helper 00cfc820 0 1   # tan
x87_helper 00cfc860 1 1   # __CItan
x87_helper 00cfc8af 0 1   # tan (x87 entry)

